name: Content Radar

on:
  # Розклад живе в Supabase (pg_cron → GitHub API), див. scripts/setupCron.ts.
  # Вбудований schedule GitHub для цього репо не спрацював жодного разу, тому його тут немає.
  workflow_dispatch: # запуск з Supabase за розкладом і кнопка "Run workflow" вручну
    inputs:
      mode:
        description: "Режим: news — новини, tools — інструменти тижня, story — вау-історія, saves — збережи собі, monthly — топ місяця"
        type: choice
        options: [news, tools, story, saves, monthly]
        default: news

# Якщо попередній запуск ще працює — новий чекає, а не біжить паралельно (щоб не було дублів)
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # якщо щось зависне — не з'їсть хвилини

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }} # для пошуку репозиторіїв (вищий ліміт GitHub API)
      MODE: ${{ inputs.mode || 'news' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm start

      # Якщо будь-який крок упав — повідомлення в бот із посиланням на лог
      - name: Notify on failure
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Content Radar (${MODE}) впав. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
